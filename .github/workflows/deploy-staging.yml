name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @campus/worker exec wrangler d1 migrations apply DB --remote --env staging
      - run: pnpm --filter @campus/worker exec wrangler deploy --env staging --var ADMIN_EMAILS:${{ vars.STAGING_ADMIN_EMAILS }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e338c1acca08049c405117d7cf92b4d1
